<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96" shape-rendering="crispEdges">
  <!-- Wrap body -->
  <rect x="16" y="24" width="32" height="64" rx="0" fill="#d4a054"/>
  <rect x="12" y="28" width="40" height="56" rx="0" fill="#c4923e"/>
  <rect x="14" y="30" width="36" height="52" rx="0" fill="#d4a054"/>
  
  <!-- Wrap fold lines -->
  <rect x="18" y="32" width="2" height="48" fill="#b8842e"/>
  <rect x="44" y="32" width="2" height="48" fill="#b8842e"/>
  
  <!-- Filling top - lettuce -->
  <rect x="20" y="16" width="24" height="8" fill="#4ade80"/>
  <rect x="18" y="18" width="4" height="6" fill="#4ade80"/>
  <rect x="42" y="18" width="4" height="6" fill="#4ade80"/>
  <rect x="22" y="14" width="6" height="4" fill="#22c55e"/>
  <rect x="36" y="14" width="6" height="4" fill="#22c55e"/>
  
  <!-- Filling top - tomato -->
  <rect x="24" y="10" width="8" height="6" fill="#ef4444"/>
  <rect x="34" y="10" width="8" height="6" fill="#ef4444"/>
  <rect x="26" y="8" width="4" height="4" fill="#dc2626"/>
  <rect x="36" y="8" width="4" height="4" fill="#dc2626"/>
  
  <!-- Filling top - meat -->
  <rect x="28" y="6" width="8" height="6" fill="#a16207"/>
  <rect x="30" y="4" width="4" height="4" fill="#92400e"/>
  
  <!-- Sauce drips -->
  <rect x="16" y="36" width="4" height="8" fill="#f59e0b" opacity="0.6"/>
  <rect x="44" y="42" width="4" height="6" fill="#f59e0b" opacity="0.6"/>
  <rect x="30" y="88" width="4" height="4" fill="#d4a054"/>
  
  <!-- Neon glow outline -->
  <rect x="10" y="4" width="44" height="86" fill="none" stroke="#ff6b2b" stroke-width="1" opacity="0.15"/>
</svg>
